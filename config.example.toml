# Copy to config.toml for local, non-secret preferences. config.toml is ignored by Git.
# Relative paths resolve from JOB_ASSISTANT_HOME when it is set, otherwise from
# the cloned project folder. The npm launcher manages JOB_ASSISTANT_HOME for you.
# Environment variables named JOB_ASSISTANT_<SETTING> override these values.

data_dir = "data"
database_path = "data/jobs.sqlite3"
export_path = "exports/job_tracker.xlsx"
log_path = "logs/job_assistant.log"
browser_user_data_dir = "data/browser-profile"
browser = "chrome" # Set to "chromium" for Playwright Chromium.
profile_path = "data/profile.json"
tailored_resume_dir = "exports/tailored_resumes"
tailored_resume_threshold = 70 # A tailored resume is created when score is at or above this value.
# Put PDF or DOCX resumes in this folder. The newest modified file is used automatically.
resume_dir = "resumes"
# Optional legacy fallback when the resume folder is empty.
resume_path = ""
